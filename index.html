<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle, #fceabb 0%, #f8b500 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            touch-action: manipulation;
        }

        .cookie {
            cursor: pointer;
            transition: transform 0.05s;
            user-select: none;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
            -webkit-tap-highlight-color: transparent;
        }

        .cookie:active { transform: scale(0.92); }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        .floating-text {
            position: absolute;
            pointer-events: none;
            font-weight: 800;
            color: #5d4037;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 50;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-80px); }
        }
    </style>
</head>
<body>

    <div id="app" class="max-w-md w-full glass-panel rounded-[2.5rem] p-8 text-center relative">
        
        <div id="start-screen">
            <div class="text-6xl mb-4">🍪</div>
            <h1 class="text-4xl font-black text-amber-900 mb-2">Cookie Challenge</h1>
            <p class="text-amber-700 mb-8 font-medium">Your timer will be randomly set to <br> 15, 30, or 60 seconds.</p>
            <button id="ready-btn" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-black py-5 rounded-2xl shadow-xl transform transition active:scale-95 text-xl">
                I'M READY!
            </button>
        </div>

        <div id="game-screen" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <div class="text-left">
                    <span class="text-[10px] uppercase tracking-widest text-amber-600 font-black block">Goal</span>
                    <span class="text-lg font-bold text-amber-900">Click Fast!</span>
                </div>
                <div class="text-right">
                    <span class="text-[10px] uppercase tracking-widest text-amber-600 font-black block">Time Left</span>
                    <span id="timer-display" class="text-3xl font-black text-red-600">--s</span>
                </div>
            </div>

            <div class="bg-amber-100 rounded-3xl py-4 mb-8">
                <span class="text-xs uppercase tracking-widest text-amber-700 font-bold">Score</span>
                <h2 id="score-display" class="text-6xl font-black text-amber-900">0</h2>
            </div>
            
            <div id="cookie-btn" class="cookie inline-block">
                <svg width="200" height="200" viewBox="0 0 200 200">
                    <circle cx="100" cy="100" r="90" fill="#d2691e" stroke="#8b4513" stroke-width="6"/>
                    <circle cx="100" cy="100" r="80" fill="#e28743"/>
                    <circle cx="60" cy="60" r="8" fill="#3e2723"/>
                    <circle cx="140" cy="70" r="10" fill="#3e2723"/>
                    <circle cx="90" cy="110" r="9" fill="#3e2723"/>
                    <circle cx="130" cy="130" r="7" fill="#3e2723"/>
                    <circle cx="70" cy="150" r="11" fill="#3e2723"/>
                    <circle cx="110" cy="40" r="6" fill="#3e2723"/>
                </svg>
            </div>
            
            <p id="hint-text" class="mt-8 text-amber-800 font-bold animate-bounce uppercase tracking-wider text-sm">
                Tap the cookie to start!
            </p>
        </div>

        <div id="result-screen" class="hidden">
            <h2 class="text-3xl font-black text-amber-900 mb-2">Time's Up!</h2>
            <p class="text-amber-700 mb-6 font-medium">Show this to your partner to record.</p>
            
            <div class="bg-amber-600 text-white rounded-3xl p-8 mb-6 shadow-lg">
                <div class="text-sm uppercase font-bold opacity-80 mb-1">Final Score</div>
                <div id="final-score" class="text-7xl font-black">0</div>
                <div id="final-mode" class="text-sm mt-2 font-bold opacity-80">in 0 seconds</div>
            </div>

            <button onclick="location.reload()" class="w-full border-2 border-amber-600 text-amber-600 font-black py-4 rounded-2xl hover:bg-amber-50 transition active:scale-95">
                PLAY AGAIN
            </button>
        </div>
    </div>

    <script>
        let score = 0;
        let timeLeft = 0;
        let initialTime = 0;
        let timerActive = false;
        let timerInterval = null;

        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const resultScreen = document.getElementById('result-screen');
        const cookieBtn = document.getElementById('cookie-btn');
        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer-display');

        document.getElementById('ready-btn').onclick = () => {
            const times = [15, 30, 60];
            initialTime = times[Math.floor(Math.random() * times.length)];
            timeLeft = initialTime;
            timerDisplay.textContent = timeLeft + "s";
            startScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
        };

        function handleInteraction(e) {
            if (timeLeft <= 0) return;
            if (!timerActive) startTimer();

            score++;
            scoreDisplay.textContent = score;

            const rect = cookieBtn.getBoundingClientRect();
            const x = (e.clientX || (e.touches ? e.touches[0].clientX : rect.left + rect.width/2));
            const y = (e.clientY || (e.touches ? e.touches[0].clientY : rect.top + rect.height/2));
            
            const span = document.createElement('span');
            span.className = 'floating-text';
            span.textContent = '+1';
            span.style.left = x + 'px';
            span.style.top = y + 'px';
            document.body.appendChild(span);
            setTimeout(() => span.remove(), 600);
        }

        function startTimer() {
            timerActive = true;
            document.getElementById('hint-text').classList.add('hidden');
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft + "s";
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            gameScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-mode').textContent = "in " + initialTime + " seconds";
        }

        cookieBtn.addEventListener('mousedown', (e) => handleInteraction(e));
        cookieBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInteraction(e);
        });
    </script>
</body>
</html>
